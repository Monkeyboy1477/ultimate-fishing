<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ultimate Fishing — Free 3D Browser Fishing Game</title>
  <meta name="description" content="Ultimate Fishing is a free 3D fishing game you can play in your browser. Cast from the dock, reel in 13 species, and upgrade your gear. No download or account needed." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <h1>Ultimate Fishing</h1>
      <div id="hud-summary">
        <span id="currency-display" class="currency-display">$0</span>
        <span id="catch-count">Catches: 0</span>
        <span id="best-catch">Best: —</span>
        <button type="button" id="fullscreen-button" class="menu-button menu-button-secondary">Fullscreen</button>
      </div>
    </header>

    <div id="toast-stack"></div>

    <div id="ad-slot-top" class="ad-slot" data-ad-size="728x90">
      <!-- TODO: replace data-ad-client/data-ad-slot below with your real AdSense values -->
      <ins class="adsbygoogle" style="display:inline-block;width:728px;height:90px"
           data-ad-client="ca-pub-0000000000000000" data-ad-slot="0000000000"></ins>
    </div>

    <main id="game-layout">
      <div id="ad-slot-side" class="ad-slot ad-slot-vertical" data-ad-size="160x600">
        <ins class="adsbygoogle" style="display:inline-block;width:160px;height:600px"
             data-ad-client="ca-pub-0000000000000000" data-ad-slot="0000000000"></ins>
      </div>

      <div id="game-stage">
        <canvas id="game-canvas" width="900" height="600"></canvas>
        <div id="hud-overlay"></div>
        <div id="menu-overlay" class="overlay"></div>
        <div id="hud-overlay-p2"></div>
        <div id="menu-overlay-p2" class="overlay"></div>
      </div>
    </main>

    <div id="ad-slot-footer" class="ad-slot" data-ad-size="728x90">
      <ins class="adsbygoogle" style="display:inline-block;width:728px;height:90px"
           data-ad-client="ca-pub-0000000000000000" data-ad-slot="0000000000"></ins>
    </div>

    <footer id="bottom-bar">
      <p>No account needed to play. Progress and gear are saved to this browser.</p>
      <p>&copy; 2026 guitar.monkey77. All rights reserved. · <a href="privacy-policy.html">Privacy Policy</a></p>
    </footer>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
  <script type="module" src="ads.js"></script>
</body>
</html>
